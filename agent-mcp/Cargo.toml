[package]
name = "agent-mcp"
version = "0.1.0"
edition = "2021"
description = "Generic MCP server that wraps any agent CLI (codex, claude, gemini, grok, …)"
homepage = "https://github.com/joeblau/homebrew-hb"
repository = "https://github.com/joeblau/homebrew-hb"
license = "MIT"

[[bin]]
name = "agent-mcp"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
wait-timeout = "0.2"
anyhow = "1"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
